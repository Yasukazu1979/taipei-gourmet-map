<style>
/* Layout: one-screen map app. Thin header + filter chips on top, map fills the rest, shop details slide up from the bottom. */
:root{
  --bg:#f3f1ea; --surface:#ffffff; --ink:#1f2421; --muted:#5f6a64; --line:#dcd8cc;
  --land:#ebe8de; --road:#ffffff; --road-case:#d3cdbd; --road-major:#fbe7a6; --road-major-case:#d9b95c;
  --water:#b9d7e3; --park:#cfe3c3; --label:#6b6455; --halo:#ebe8de;
  --breakfast:#0e7c6b; --sweets:#c4364f; --local:#c47410; --cafe:#6b4226; --hotel:#2456c4;
  --open:#13804a; --closed:#8a8f8c; --shadow:0 6px 24px rgba(40,35,20,.18);
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Microsoft JhengHei","PingFang TC",sans-serif;
  --font-display:"Zen Maru Gothic","Zen Kaku Gothic New","Hiragino Maru Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a18; --surface:#202623; --ink:#eef0ea; --muted:#a3ada7; --line:#36403b;
  --land:#1c2120; --road:#39423e; --road-case:#2a312e; --road-major:#6b5f37; --road-major-case:#4a422a;
  --water:#1f3a47; --park:#21362a; --label:#b8b19c; --halo:#1c2120;
  --breakfast:#2fb39c; --sweets:#ef6a80; --local:#e69a3a; --cafe:#c8956a; --hotel:#6f98f0;
  --open:#41c27e; --closed:#7e8682; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a18; --surface:#202623; --ink:#eef0ea; --muted:#a3ada7; --line:#36403b;
  --land:#1c2120; --road:#39423e; --road-case:#2a312e; --road-major:#6b5f37; --road-major-case:#4a422a;
  --water:#1f3a47; --park:#21362a; --label:#b8b19c; --halo:#1c2120;
  --breakfast:#2fb39c; --sweets:#ef6a80; --local:#e69a3a; --cafe:#c8956a; --hotel:#6f98f0;
  --open:#41c27e; --closed:#7e8682; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:2000;background:var(--surface)}
.app{height:100%;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:1001;flex:none}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:900;font-size:1.2rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.78rem;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;
  padding:5px 12px;font:500 .82rem/1.2 var(--font-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.fab:focus-visible,.row:focus-visible{outline:3px solid var(--hotel);outline-offset:2px}
#map{flex:1;min-height:0;background:var(--land)}
.leaflet-container{background:var(--land);font-family:var(--font-body)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--bg)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}

/* map layers */
.w-water{fill:var(--water);stroke:none}
.w-park{fill:var(--park);stroke:none}
.r-minor-c{stroke:var(--road-case)} .r-minor{stroke:var(--road)}
.r-mid-c{stroke:var(--road-case)} .r-mid{stroke:var(--road)}
.r-major-c{stroke:var(--road-major-case)} .r-major{stroke:var(--road-major)}
.rlabel{color:var(--label);font-size:11px;font-weight:500;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 3px var(--halo)}
.rlabel span{display:inline-block;transform:translate(-50%,-50%) rotate(var(--a))}
.stn{pointer-events:none;white-space:nowrap}
.stn span{display:inline-flex;align-items:center;gap:4px;transform:translate(-9px,-50%);font-size:11.5px;font-weight:700;color:var(--ink);
  text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 3px var(--halo)}
.stn i{width:16px;height:16px;border-radius:4px;background:var(--hotel);color:#fff;font:700 10px/16px var(--font-body);text-align:center;font-style:normal;text-shadow:none;flex:none}

/* shop pins */
.pin{background:none;border:0}
.pin b{position:absolute;left:0;top:0;width:30px;height:30px;transform:translate(-50%,-100%);display:grid;place-items:center;
  font:700 14px/1 var(--font-body);color:#fff;font-variant-numeric:tabular-nums;
  background:var(--c);border:2px solid var(--surface);border-radius:50% 50% 50% 0;rotate:-45deg;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:scale .15s}
.pin b span{rotate:45deg}
.pin.on b{scale:1.35;z-index:5}
.far .pin b{width:24px;height:24px;font-size:12px}
.far .stn span{font-size:0;gap:0}
.pin.dim b{opacity:.25}
.pin.hotel b{border-radius:8px;rotate:0deg;transform:translate(-50%,-50%);width:30px;height:30px}
.pin.hotel b span{rotate:0deg}

/* floating buttons */
.fabs{position:absolute;z-index:1000;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.fab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;
  font:700 .88rem/1 var(--font-body);box-shadow:var(--shadow);cursor:pointer}
.mapwrap{position:relative;flex:1;min-height:0;display:flex}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1500;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.22);
  max-height:62%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
@media (min-width:760px){.sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:18px;max-height:calc(100% - 140px)}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding-block:10px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);flex:none}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 17px/1 var(--font-body);font-variant-numeric:tabular-nums}
.head-txt{flex:1;min-width:0}
.cat{font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.06em}
.sheet h2{font-family:var(--font-display);font-size:1.18rem;line-height:1.35;margin:1px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.zh{color:var(--muted);font-size:.8rem;margin-top:2px;overflow-wrap:anywhere}
.x{flex:none;border:0;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.sheet-body{overflow-y:auto;padding-block:12px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.86rem;padding:3px 10px;border-radius:999px;align-self:flex-start;
  background:color-mix(in srgb,var(--s) 14%,transparent);color:var(--s)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border-radius:12px;padding:11px 8px;font:700 .9rem/1.2 var(--font-body);
  border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:center}
.btn.primary{background:var(--c);border-color:var(--c);color:#fff}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.88rem}
dt{color:var(--muted);font-weight:500;white-space:nowrap}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.addr{display:flex;gap:8px;align-items:flex-start}
.addr span{flex:1;min-width:0;user-select:all}
.copy{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:500 .74rem/1 var(--font-body);padding:5px 8px;cursor:pointer}
.week{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-variant-numeric:tabular-nums}
.week .today{font-weight:700;color:var(--ink)}
.week span{color:var(--muted)}
.week span.today{color:var(--ink)}
.src{font-size:.72rem;color:var(--muted)}
section h3{font-size:.8rem;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;font-weight:700}
section p{margin:0;font-size:.92rem;line-height:1.75}
.tip{background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:12px;padding:10px 12px}
.pager{display:flex;justify-content:space-between;gap:8px}
.pager .btn{flex:1}

/* list */
.list{display:flex;flex-direction:column}

  menu:'炭燒花醬蛋吐司（炭火焼きピーナッツバター＆エッグトースト）、炭燒花醬肉蛋吐司（豚ロース入り）、炭燒肉蛋吐司（約55〜65元）、冷萃緑茶・紅茶（約35〜45元）。',
  desc:'行天宮近くの路地にある炭火焼きトースト専門店。看板メニューの「炭燒花醬蛋吐司」は、炭火で香ばしく焼いた食パンに濃厚な粒入りピーナッツバターととろとろの半熟卵を合わせた、日本には無い甘じょっぱい味付けが特徴です。口コミでは「半分にカットされた断面から半熟の黄身が溢れ出し、秘伝ダレの直火焼き豚ロースやピーナッツバターと絡んで絶品」「パンが炭火の香りをまとってサクッと香ばしい」と高評価を得ています。',

  addr:'台北市中山區松江路297巷',lat:25.0610188,lng:121.5333524,hours:'月〜土 10:30〜18:00（日曜休）',sched:W(MS,[[T(10,30),T(18)]]),src:SRC_PDF,
  menu:'1個 14元／1パック（6個入り）80元。具材は全6種類（黒ゴマ・ピーナッツ・小豆・タロイモ・緑豆・原味）。',
  desc:'落花生（ピーナッツ）の粉がたっぷりまぶされた伝統的な客家式お餅の屋台。非常にやわらかいお餅で、6種類それぞれの美味しさが楽しめます。口コミでは「赤ちゃんのほっぺのように柔らかくモチモチ（Q彈）なのに歯にくっつかない」「中の餡がこぼれるほどぎっしり詰まっている（特に黒ゴマ・ピーナッツ・タロイモが人気）」と圧倒的な支持を集めています。',
  tip:'人気のため「1人2パックまで」の購入制限があり、2パックまとめ買いすると1個おまけが付きます。好きな味を6個自由に組み合わせる「綜合（ミックス）」注文が可能。無添加の作りたてのため、固くならないうちに当日中に食べるのが鉄則です。'},
 {no:4,cat:'朝食',name:'世界豆漿大王',zh:'世界豆漿大王',area:'林森北路（雙連駅／中山國小駅）',

  menu:'具材入り焼餅（シャオビン）、大根餅（蘿蔔糕）、鹹豆漿（シェントウジャン）、冰豆漿（冷たい豆乳）、豬排蛋餅、小籠包（1品 約30〜80元前後）。',
  desc:'林森北路の路地にある定番の台湾式朝食店。具材入りの焼餅や表面をカリッと焼いた大根餅、おぼろ豆腐のような鹹豆漿が有名で、ドリンクはすっきりとした甘さの冷たい豆乳（冰豆漿）を合わせるのがおすすめです。口コミではさらに「鉄板で焼くポークソテー入り蛋餅（豬排蛋餅）や、朝から注文できる肉汁たっぷりのローカル小籠包も安くて美味しい」と評判です。',
  tip:'店員さんが日本人客に慣れており、日本語メニューや注文用紙があって安心、との口コミがあります。'},

  menu:'魯肉飯（約35元）、油豆腐（煮込み豆腐）、滷蛋（煮玉子）、金針赤肉湯（約60元）、炸排骨（約70元）。',
  desc:'雙連駅すぐの路地で早朝6時半から営業する、創業数十年の老舗で台湾グルメアワード「500碗」にも選出された名店。朝食時間帯ですがルーロー飯（魯肉飯）が絶品のお店で、じっくり味が染み込んだ豆腐や玉子もトッピングして合わせるのがおすすめです。口コミでは「とろとろに煮込まれた皮付きの豚バラ肉からコラーゲン（膠質）が溶け出し、甘辛くコク深い醤油ダレが白飯に絡んで箸が止まらない」「添えられた酸菜（高菜漬け）が脂の甘みを引き締めてくれる」と地元客・観光客双方から絶賛されています。',
  tip:'店頭に並ぶ小菜（筍の煮物や豚の角煮など）を指差しで追加できます。'},

 {no:21,cat:'カフェ',name:'Alchemist Daan',zh:'Alchemist Daan',area:'大安区・杭州南路二段',

const CATC={'朝食':'var(--breakfast)','スイーツ':'var(--sweets)','ローカルグルメ':'var(--local)','カフェ':'var(--cafe)','宿泊ホテル':'var(--hotel)'};
const DOW=['日','月','火','水','木','金','土'];
const CIRC=['★','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳','㉑'];

/* ---------- 台北時間と営業状況 ---------- */
function taipeiNow(){const t=new Date(Date.now()+8*3600e3);return {d:t.getUTCDay(),m:t.getUTCHours()*60+t.getUTCMinutes(),h:t.getUTCHours(),mi:t.getUTCMinutes()}}
const hm=(m)=>{m%=1440;return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
function status(s){
  if(!s.sched) return null;
  const n=taipeiNow();
  const yd=(n.d+6)%7;
  for(const [a,b] of s.sched[yd]) if(b>1440 && n.m+1440<b) return {open:true,text:'営業中・'+hm(b)+'まで'};
  for(const [a,b] of s.sched[n.d]) if(n.m>=a && n.m<b) return {open:true,text:'営業中・'+(b>=1440?'翌':'')+hm(b)+'まで'};
  for(const [a] of s.sched[n.d]) if(n.m<a) return {open:false,text:'本日 '+hm(a)+'から'};
  for(let k=1;k<=7;k++){const d=(n.d+k)%7;if(s.sched[d].length) return {open:false,text:(k===1?'明日':DOW[d]+'曜')+' '+hm(s.sched[d][0][0])+'から'}}
  return {open:false,text:'営業時間外'};
}
function clock(){const n=taipeiNow();document.getElementById('clock').textContent='台北 '+DOW[n.d]+'曜 '+n.h+':'+String(n.mi).padStart(2,'0')}

/* ---------- 地図 ---------- */
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:13,maxZoom:19,zoomSnap:.25,
  maxBounds:[[25.005,121.47],[25.09,121.59]],maxBoundsViscosity:.8});
map.attributionControl.setPrefix(false).addAttribution('地図データ © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>');
const base=L.svg({padding:.5}).addTo(map);
const poly=(arr,cls)=>arr.forEach(g=>L.polygon(g,{renderer:base,className:cls,interactive:false,stroke:false,fillOpacity:1}).addTo(map));
poly(MAP.water,'w-water'); poly(MAP.park,'w-park');
const lines={};
function roads(key,arr,wCase,w){
  const c=arr.map(g=>L.polyline(g,{renderer:base,className:'r-'+key+'-c',interactive:false,weight:wCase,lineCap:'round',lineJoin:'round',opacity:1}));
  const f=arr.map(g=>L.polyline(g,{renderer:base,className:'r-'+key,interactive:false,weight:w,lineCap:'round',lineJoin:'round',opacity:1}));
  lines[key]={c,f,wCase,w};
}
roads('minor',MAP.minor,3.5,2); roads('mid',MAP.mid,5,3.5); roads('major',MAP.major,7.5,5.5);
['minor','mid','major'].forEach(k=>lines[k].c.forEach(l=>l.addTo(map)));
['minor','mid','major'].forEach(k=>lines[k].f.forEach(l=>l.addTo(map)));
function scaleRoads(){const z=map.getZoom(),k=Math.max(.45,Math.pow(1.45,z-16));
  for(const key in lines){const L_=lines[key];L_.c.forEach(l=>l.setStyle({weight:L_.wCase*k}));L_.f.forEach(l=>l.setStyle({weight:L_.w*k}))}}
const labelLayer=L.layerGroup();
MAP.labels.forEach(([la,lo,n,a])=>L.marker([la,lo],{interactive:false,keyboard:false,icon:L.divIcon({className:'rlabel',html:`<span style="--a:${a}deg">${n}</span>`,iconSize:[0,0]})}).addTo(labelLayer));
const stnLayer=L.layerGroup().addTo(map);
MAP.st.forEach(([la,lo,n])=>L.marker([la,lo],{interactive:false,keyboard:false,zIndexOffset:-1000,icon:L.divIcon({className:'stn',html:`<span><i>M</i>${n}</span>`,iconSize:[0,0]})}).addTo(stnLayer));
function zoomLayers(){const z=map.getZoom();if(z>=15.5)labelLayer.addTo(map);else labelLayer.remove();
  map.getContainer().classList.toggle('far',z<15);scaleRoads()}
map.on('zoomend',zoomLayers);

const markers={};
SHOPS.forEach(s=>{
  const c=CATC[s.cat];
  const icon=L.divIcon({className:'pin'+(s.hotel?' hotel':''),html:`<b style="--c:${c}"><span>${s.hotel?'★':s.no}</span></b>`,iconSize:[0,0]});
  const m=L.marker([s.lat,s.lng],{icon,title:(s.hotel?'宿泊ホテル ':s.no+' ')+s.name,riseOnHover:true,zIndexOffset:s.hotel?-500:0}).addTo(map);
  m.on('click',()=>openShop(s.no));
  markers[s.no]=m;
});
function fitAll(){map.fitBounds(L.latLngBounds(SHOPS.map(s=>[s.lat,s.lng])),{paddingTopLeft:[24,24],paddingBottomRight:[24,70]})}

/* ---------- フィルター ---------- */
let fCat='all', fOpen=false;
function visible(s){if(s.hotel)return true;if(fCat!=='all'&&s.cat!==fCat)return false;if(fOpen){const st=status(s);if(!st||!st.open)return false}return true}
function applyFilter(){SHOPS.forEach(s=>{const el=markers[s.no].getElement();if(el)el.classList.toggle('dim',!visible(s))})}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.open){fOpen=!fOpen;b.setAttribute('aria-pressed',fOpen)}
  else{fCat=b.dataset.f;document.querySelectorAll('.chip[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b))}
  applyFilter(); if(sheetMode==='list') showList();
}));

/* ---------- シート ---------- */
const sheet=document.getElementById('sheet'),head=document.getElementById('sheet-head'),body=document.getElementById('sheet-body');
let sheetMode=null,current=null;
const esc=(t)=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function weekHtml(s){
  const n=taipeiNow(),order=[1,2,3,4,5,6,0];
  return '<div class="week">'+order.map(d=>{const r=s.sched[d];const t=r.length?r.map(([a,b])=>hm(a)+'〜'+(b>1440?'翌':'')+hm(b)).join('／'):'定休日';
    const cl=d===n.d?' class="today"':'';return `<span${cl}>${DOW[d]}</span><span${cl}>${t}</span>`}).join('')+'</div>';
}
function openShop(no){
  const s=SHOPS.find(x=>x.no===no); current=no; sheetMode='shop';
  Object.values(markers).forEach(m=>m.getElement()?.classList.remove('on'));
  markers[no].getElement()?.classList.add('on');
  const c=CATC[s.cat]; sheet.style.setProperty('--c',c);
  const st=status(s);
  head.innerHTML=`<div class="num" style="--c:${c}">${s.hotel?'★':s.no}</div>
    <div class="head-txt"><div class="cat">${esc(s.cat)}</div><h2 id="sheet-title">${esc(s.name)}</h2>
    ${s.zh!==s.name?`<div class="zh">${esc(s.zh)}</div>`:''}</div>
    <button class="x" id="close" aria-label="閉じる">×</button>`;
  const q=encodeURIComponent(s.zh+' '+s.addr);
  const idx=SHOPS.findIndex(x=>x.no===no);
  const prev=SHOPS[(idx-1+SHOPS.length)%SHOPS.length],next=SHOPS[(idx+1)%SHOPS.length];
  body.innerHTML=`
    ${st?`<span class="status" style="--s:${st.open?'var(--open)':'var(--closed)'}">${st.text}</span>`:''}
    <div class="actions">
      <a class="btn primary" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=walking" target="_blank" rel="noopener">ここへのルート</a>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Googleマップで見る</a>
    </div>
    <dl>
      <dt>エリア</dt><dd>${esc(s.area)}</dd>
      <dt>住所</dt><dd><div class="addr"><span id="addr">${esc(s.addr)}</span><button class="copy" id="copy">コピー</button></div></dd>
      ${s.sched?`<dt>営業</dt><dd>${weekHtml(s)}<div class="src">${s.src}。変わることがあるので、行く前にGoogleマップでもご確認ください。</div></dd>`:''}
    </dl>
    ${s.menu?`<section><h3>メニュー・価格の目安</h3><p>${esc(s.menu)}</p></section>`:''}
    ${s.desc?`<section><h3>${s.hotel?'メモ':'特徴・口コミ'}</h3><p>${esc(s.desc)}</p></section>`:''}
    ${s.tip?`<section class="tip"><h3>行くときのコツ</h3><p>${esc(s.tip)}</p></section>`:''}
    <div class="pager">
      <button class="btn" id="prev">‹ ${prev.hotel?'ホテル':CIRC[prev.no]+' '+esc(prev.name.slice(0,6))}</button>
      <button class="btn" id="next">${next.hotel?'ホテル':CIRC[next.no]+' '+esc(next.name.slice(0,6))} ›</button>
    </div>`;
  body.scrollTop=0;
  document.getElementById('close').onclick=closeSheet;
  document.getElementById('prev').onclick=()=>{openShop(prev.no);focusShop(prev)};
  document.getElementById('next').onclick=()=>{openShop(next.no);focusShop(next)};
  document.getElementById('copy').onclick=async(e)=>{const b=e.currentTarget;
    try{await navigator.clipboard.writeText(s.addr);b.textContent='コピーしました'}
    catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById('addr'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent='選択しました'}
    setTimeout(()=>b.textContent='コピー',1800)};
  sheet.classList.add('open');
}
function focusShop(s){
  // ピンがシートに隠れないよう、地図の見えている部分の中央に来るようにずらす
  const z=Math.max(map.getZoom(),16), sz=map.getSize(), target=map.project([s.lat,s.lng],z);
  const mapRect=document.getElementById('map').getBoundingClientRect();
  const sheetTop=window.innerHeight-sheet.offsetHeight;
  const covered=Math.max(0,mapRect.bottom-sheetTop);
  const offset=window.innerWidth>=760?L.point(200,0):L.point(0,covered/2);
  map.flyTo(map.unproject(target.add(offset),z),z,{duration:.6});
}
function showList(){
  sheetMode='list'; current=null; sheet.style.setProperty('--c','var(--ink)');
  Object.values(markers).forEach(m=>m.getElement()?.classList.remove('on'));
  head.innerHTML=`<div class="head-txt"><div class="cat" style="color:var(--muted)">全21店舗</div><h2 id="sheet-title">店舗一覧</h2></div><button class="x" id="close" aria-label="閉じる">×</button>`;
  const groups=[['晴光市場・行天宮・林森北路エリア',[1,2,3,4]],['雙連・寧夏夜市エリア',[5,6,7,8,9]],['台北駅・善導寺・龍山寺エリア',[10,11,12,13,14]],['カフェ',[15,16,17,18,19,20,21]]];
  body.innerHTML='<div class="list">'+groups.map(([g,ids])=>{
    const rows=ids.map(i=>SHOPS.find(s=>s.no===i)).filter(visible).map(s=>{const st=status(s);
      return `<button class="row" data-no="${s.no}"><span class="num" style="--c:${CATC[s.cat]}">${s.hotel?'★':s.no}</span>
      <span class="t"><b>${esc(s.name)}</b><small>${esc(s.cat)}・${esc(s.area)}</small></span>
      ${st?`<span class="st" style="--s:${st.open?'var(--open)':'var(--closed)'}">${st.open?'営業中':'時間外'}</span>`:''}</button>`}).join('');
    return rows?`<div class="group">${g}</div>${rows}`:'';
  }).join('')+'</div><p class="note">営業時間：①〜⑧は資料の一覧表、⑨〜⑭はGoogleマップ掲載の時間（2026/11/15確認）、⑮〜㉑はいただいた一覧（Googleマップとも一致・11/16確認）です。「営業中」は台北時間で判定しています。</p>';
  body.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const s=SHOPS.find(x=>x.no===+r.dataset.no);openShop(s.no);focusShop(s)});
  document.getElementById('close').onclick=closeSheet;
  body.scrollTop=0; sheet.classList.add('open');
}
function closeSheet(){sheet.classList.remove('open');sheetMode=null;current=null;Object.values(markers).forEach(m=>m.getElement()?.classList.remove('on'))}
document.getElementById('btn-list').onclick=()=>sheetMode==='list'?closeSheet():showList();
document.getElementById('btn-fit').onclick=()=>{closeSheet();fitAll()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
/* swipe down on header closes */
let y0=null;head.addEventListener('touchstart',e=>y0=e.touches[0].clientY,{passive:true});
head.addEventListener('touchend',e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>50)closeSheet();y0=null});

fitAll(); zoomLayers(); applyFilter(); clock();
/* #s13 で⑬を開く・#list で一覧（お店ごとのリンク共有用） */
function route(){const h=location.hash.slice(1);const m=h.match(/^s(\d{1,2})$/);
  if(m){const s=SHOPS.find(x=>x.no===+m[1]);if(s){openShop(s.no);focusShop(s)}} else if(h==='list') showList();}
window.addEventListener('hashchange',route); route();
setInterval(()=>{clock();applyFilter();if(sheetMode==='shop'&&current!==null){const el=body.querySelector('.status');const st=status(SHOPS.find(x=>x.no===current));if(el&&st){el.textContent=st.text;el.style.setProperty('--s',st.open?'var(--open)':'var(--closed)')}}},30000);
</script>
</body></html>
